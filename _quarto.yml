project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!*.md"
resources:
  - .nojekyll

website:
  title: "Social Data Analysis and Visualization"
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "Schedule"
        file: schedule.qmd
      - text: "Install R"
        file: install.qmd
    right:
      - icon: github
        href: https://github.com/aysedeniz09/IntroCSS
        aria-label: GitHub

  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - index.qmd
          - schedule.qmd
          - install.qmd
      - section: "Class Sessions"
        contents:
          - text: "Session 1 - Why CSS? R Basics"
            file: sessions/01/session.qmd
          - text: "Session 2 - Data Wrangling"
            file: sessions/02/session.qmd
          - text: "Session 3 - Collecting Data"
            file: sessions/03/session.qmd
          - text: "Session 4 - Cleaning Text"
            file: sessions/04/session.qmd
          - text: "Session 5 - Visualization & Dashboards"
            file: sessions/05/session.qmd
          - text: "Session 6 - Text as Data I"
            file: sessions/06/session.qmd
          - text: "Session 7 - Dictionaries & Sentiment"
            file: sessions/07/session.qmd
          - text: "Session 8 - Topic Modeling"
            file: sessions/08/session.qmd
          - text: "Session 9 - Topics over Time"
            file: sessions/09/session.qmd
          - text: "Session 10 - Topic Networks"
            file: sessions/10/session.qmd
          - text: "Session 11 - Publishing Your Dashboard"
            file: sessions/11/session.qmd
          - text: "Session 12 - Dashboard Presentations"
            file: sessions/12/session.qmd
      - section: "Resources"
        contents:
          - text: "R Cheatsheets"
            file: resources/cheatsheets.qmd
          - text: "Datasets"
            file: resources/datasets.qmd

  page-footer:
    left: "© 2027 Ayse D. Lokmanoglu, Boston University"
    right:
      - icon: envelope
        href: mailto:alokman@bu.edu
      - icon: github
        href: https://github.com/aysedeniz09

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: false
    link-external-newwindow: true